<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Checkbox App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
</head>
<body>
    <h2>Select Data Points to Display on Map</h2>
    <label><input type="checkbox" id="checkbox1" value="data1"> Data Set 1</label><br>
    <label><input type="checkbox" id="checkbox2" value="data2"> Data Set 2</label><br>
    <label><input type="checkbox" id="checkbox3" value="data3"> Data Set 3</label><br>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
